name: UI CI (production bar)

# SPEC-4 Step 21 — the frontend production bar. One job runs every quality gate
# the console must clear before merge; the job FAILS if ANY gate fails, which is
# the Step-21 acceptance ("CI fails on bundle-budget or axe or E2E regression").
#
# Gate chain (in order):
#   1. typecheck        — tsc --noEmit
#   2. lint             — eslint
#   3. unit tests       — vitest run (includes the jsdom jest-axe a11y gate)
#   4. build            — vite-react-ssg build → ui/dist
#   5. bundle-budget    — app-shell initial JS ≤ 200 KB gz (fails over budget)
#   6. e2e + visual     — playwright (golden path, in-browser axe, visual
#                         regression) against the built app with a mocked API
#
# Runs on PRs (and pushes to the default branches) that touch ui/ or this file.
# This is a separate workflow from ci.yml so it never interferes with the Python
# backend / docker jobs there.

on:
  # Manual, because a push made by a workflow using the default GITHUB_TOKEN does
  # NOT trigger other workflows — so the baseline-refresh job's own commit lands
  # without this gate ever checking it. This is how you re-run it on demand.
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-ci.yml"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: typecheck · lint · test · build · budget · e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ---- static gates -------------------------------------------------
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest — includes jsdom axe a11y gate)
        run: npm test

      # ---- build + bundle budget ---------------------------------------
      - name: Build (vite-react-ssg → dist)
        run: npm run build

      - name: Bundle budget (app-shell initial JS ≤ 200 KB gz)
        run: npm run budget

      # ---- browser gates: e2e + in-browser axe + visual regression -----
      # Cache the Playwright browser download keyed on the installed version so
      # we only re-download chromium when @playwright/test bumps.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright chromium (+ system deps)
        run: npx playwright install --with-deps chromium

      - name: E2E + visual regression + axe (mocked API)
        # Fails on: golden-path breakage, a critical axe violation, or any
        # visual-snapshot drift beyond tolerance. Serves the built dist via
        # `vite preview` and mocks every /api/** call — no live backend needed.
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
